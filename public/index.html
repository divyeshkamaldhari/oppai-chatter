<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff4d6d" />
  <meta name="description"
    content="Join the ultimate Oppai Dragon Chat App – powered by dragons, built with React! – Connect with your dream one in the most aesthetic anime-inspired chat app." />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  
  <!-- iOS specific meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Oppai Dragon Chats" />
  
  <!-- Safari specific meta tags -->
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-touch-fullscreen" content="yes" />
  
  <!-- Prevent zoom on input focus for iOS -->
  <style>
    input, textarea, select {
      font-size: 16px !important;
    }
    
    /* Prevent horizontal scrolling on iOS */
    body {
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Better touch targets for iOS */
    button, [role="button"] {
      min-height: 44px;
      min-width: 44px;
    }
    
    /* Safari-specific fixes */
    * {
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      box-sizing: border-box;
    }
    
    /* Fix for Safari flexbox issues */
    .flex-container {
      display: -webkit-box;
      display: -webkit-flex;
      display: -ms-flexbox;
      display: flex;
    }
    
    /* Fix for Safari viewport height issues */
    .vh-fix {
      height: 100vh;
      height: -webkit-fill-available;
    }
    
    /* Fix for Safari input styling */
    input, textarea {
      -webkit-appearance: none;
      border-radius: 0;
    }
    
    /* Fix for Safari button styling */
    button {
      -webkit-appearance: none;
      border: none;
      background: transparent;
    }
    
    /* Fix for Safari scrollbar issues */
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }
    
    /* Fix for Safari animation issues */
    @media (prefers-reduced-motion: no-preference) {
      * {
        -webkit-animation-fill-mode: both;
        animation-fill-mode: both;
      }
    }
  </style>
  
  <title>Oppai Dragon Chats</title>
  
  <!-- iOS-specific CSS -->
  <style>
    /* Fix for iOS Safari 100vh issue */
    :root {
      --vh: 1vh;
    }
    
    /* Prevent zoom on input focus */
    input, textarea, select {
      font-size: 16px !important;
    }
    
    /* iOS-specific touch improvements */
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    /* Allow text selection in specific areas */
    input, textarea, [contenteditable] {
      -webkit-user-select: text;
      user-select: text;
    }
    
    /* Fix for iOS Safari momentum scrolling */
    .cometchat-root {
      -webkit-overflow-scrolling: touch;
    }
    
    /* Prevent iOS Safari from adding margins */
    body {
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to Oppai Dragon Chats</noscript>
  <div id="root"></div>
</body>

</html>
